---
name: CI

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - LICENSE
      - .gitignore
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - LICENSE
      - .gitignore
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  # Follows the repository name automatically
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install prek
        run: python3 -m pip install "prek==${PREK_VERSION}"
        env:
          PREK_VERSION: '0.5.5'

      - name: Install Prek Hooks
        run: |
          prek install-hooks

      - name: Check ALL Files On Branch
        run: |
          prek run --show-diff-on-failure --color=always --all-files

      - name: Run action unit tests
        run: python3 -m unittest discover -s tests -v


  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: amd64
          - runner: ubuntu-26.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          load: true
          tags: salt-push:ci
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.arch }}

      - name: Build image with baked package
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          load: true
          build-args: |-
            PYTHON_PACKAGES=saltext-github
          tags: salt-push:ci-baked
          cache-from: type=gha,scope=baked-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=baked-${{ matrix.arch }}

      - name: Run smoke tests
        run: tests/smoke.sh salt-push:ci salt-push:ci-baked

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push by digest
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          labels: |-
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ matrix.arch }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  action-test:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # Docker daemons aren't shared across jobs, so build locally from the
      # shared gha cache scope (hot after the build job's first run).
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          load: true
          tags: salt-push:ci
          cache-from: type=gha,scope=build-amd64

      - name: Default highstate
        uses: ./
        with:
          image: salt-push:ci
          pull: never
          states: tests/fixtures/srv/salt
          pillars: tests/fixtures/srv/pillar
          logs-dir: ${{ runner.temp }}/salt-logs
          log-file-level: debug

      - name: Assert file logs captured
        run: test -s "${RUNNER_TEMP}/salt-logs/minion"

      # No trees at all: the absent default mounts are skipped silently
      - name: Multiple commands + inline resources
        uses: ./
        with:
          image: salt-push:ci
          pull: never
          resources: 'dummy: {resource_ids: [env-01]}'
          summary: 'true'
          commands: |-
            # comment and blank lines are skipped

            salt-call test.ping
            salt -T dummy test.ping

      - name: Failing command
        id: failing
        continue-on-error: true
        uses: ./
        with:
          image: salt-push:ci
          pull: never
          states: tests/fixtures/srv/salt
          pillars: tests/fixtures/srv/pillar
          commands: |-
            salt-call state.apply fail
            salt-call test.ping

      - name: Assert failure is reported
        env:
          OUTCOME: ${{ steps.failing.outcome }}
          EXIT_CODE: ${{ steps.failing.outputs.exit-code }}
          FAILED_COMMAND: ${{ steps.failing.outputs.failed-command }}
        run: |
          [[ "${OUTCOME}" == failure ]]
          [[ "${EXIT_CODE}" == 2 ]]
          [[ "${FAILED_COMMAND}" == "salt-call state.apply fail" ]]

      # cache/save runs at action end (not as a job post-step), so the
      # round-trip is testable within a single job.
      - name: Cache round-trip (save, whitelisted)
        uses: ./
        with:
          image: salt-push:ci
          pull: never
          cache-key: action-test-${{ github.run_id }}
          cache-paths: keep
          commands: |-
            salt-call cmd.run 'mkdir -p /app/cache/keep && touch /app/cache/keep/marker /app/cache/drop-marker'

      - name: Drop local cache dir
        run: rm -rf "${RUNNER_TEMP}/salt-push-cache"

      - name: Cache round-trip (restore)
        uses: ./
        with:
          image: salt-push:ci
          pull: never
          cache-key: action-test-${{ github.run_id }}
          cache-paths: keep
          commands: salt-call test.ping

      - name: Assert whitelisted path restored, rest dropped
        run: |
          test -f "${RUNNER_TEMP}/salt-push-cache/keep/marker"
          test ! -e "${RUNNER_TEMP}/salt-push-cache/drop-marker"

  publish:
    if: github.event_name != 'pull_request'
    needs:
      - build
      - lint
      - action-test
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Determine Salt version from base image tag
        id: version
        run: |
          salt_version="$(sed -nE 's|^FROM ghcr.io/cdalvaro/docker-salt-master:([0-9.]+)@.*|\1|p' Dockerfile)"
          [[ -n "${salt_version}" ]]
          echo "salt=${salt_version}" >>"$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        env:
          SALT_VERSION: ${{ steps.version.outputs.salt }}
        run: |
          digests=()
          for digest in *; do
            digests+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create \
            --tag "${IMAGE}:${SALT_VERSION}" \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:sha-${GITHUB_SHA::7}" \
            "${digests[@]}"

      - name: Inspect published manifest
        run: docker buildx imagetools inspect "${IMAGE}:latest"
