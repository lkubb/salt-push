repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 38bfb07c0c64c304f47eb52090f8288150c77730  # v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/hukkin/mdformat
    rev: 2d496dbc18e31b83a1596685347ffe0b6041daf0  # 1.0.0
    hooks:
    - id: mdformat
      additional_dependencies:
      - mdformat-gfm
      - mdformat-config
      - mdformat-ruff
      - mdformat-shfmt  # requires shfmt, docker or podman

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: 479be5958357ba5ab65ce47172117348516860e9  # v3.14.1-1
    hooks:
      - id: shfmt         # prebuilt upstream executable
        args:
          - --write
          - --simplify
      #- id: shfmt-src     # build from source (requires/installs Go to build)
      #- id: shfmt-docker  # Docker image (requires Docker to run)

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a6564f5d57444e123433a5c9af733e3975c77229  # v0.11.0.1-1
    hooks:
      - id: shellcheck

  - repo: https://github.com/shenxianpeng/hadolint-pre-commit
    rev: 6b998985ab8b766ed8104e4fcfeb0a4765f4c364  # v2.15.1.2
    hooks:
      - id: hadolint

  - repo: https://github.com/kjanat/actionlint
    rev: 08bb2c4f0d039744455b87aef1c647fb8b66d37b  # v1.17.0
    hooks:
      - id: actionlint-shellcheck
        alias: actionlint
